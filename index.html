<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./style.css" />

    <title>Frontend Mentor | Social Links Profile</title>
  </head>
  <body>
    <main>
      <section class="profile">
        <p class="availability">
          <span class="availability__dot" aria-hidden="true"></span>
          Available for opportunities
        </p>
        <div class="profile-photo-wrapper">
          <img
            class="profile-photo"
            src="./assets/images/profile-pic (1).png"
            alt="Portrait of Felipe Santos Belphman"
          />
        </div>
        <p class="professional-role">UI/UX Designer • Front-end Developer</p>
        <h1>Felipe Santos Belphman</h1>
        <p class="profile-description">
          I design intuitive interfaces and build responsive web experiences.
        </p>
        <ul>
          <li>
            <a
              href="https://github.com/felipesbelphman-web"
              target="_blank"
              rel="noopener"
            >
              <span class="link-text">GitHub</span>
              <img
                class="link-icon"
                src="./assets/icons/github.svg"
                alt="#"
                aria-hidden="true"
              />
            </a>
          </li>
          <li>
            <a
              href="https://www.linkedin.com/in/felipe-belphman-2a073823b/"
              target="_blank"
              rel="noopener"
            >
              <span class="link-text">LinkedIn</span>
              <img
                class="link-icon"
                src="./assets/icons/linkedin.svg"
                alt="#"
                aria-hidden="true"
              />
            </a>
          </li>
          <li>
            <a href="https://wa.me/353896028494" target="_blank" rel="noopener">
              <span class="link-text">WhatsApp</span>
              <img
                class="link-icon"
                src="./assets/icons/whatsapp.svg"
                alt="#"
                aria-hidden="true"
              />
            </a>
          </li>
          <li>
            <a
              href="https://www.instagram.com/felipesantosbelphman/"
              target="_blank"
              rel="noopener"
            >
              <span class="link-text">Instagram</span>
              <img
                class="link-icon"
                src="./assets/icons/instagram.svg"
                alt="#"
                aria-hidden="true"
              />
            </a>
          </li>
          <li>
            <a
              href="https://felipesbelphman-web.github.io/portfolio-felipe-belphman/"
              target="_blank"
              rel="noopener"
            >
              <span class="link-text">Portfolio</span>
              <img
                class="link-icon"
                src="./assets/icons/portfolio.svg"
                alt="#"
                aria-hidden="true"
              />
            </a>
          </li>
        </ul>
        <p class="profile-location">
          <img src="./assets/icons/location.svg" alt="" aria-hidden="true" />
          <span>Dublin, Ireland</span>
        </p>
      </section>
    </main>
  </body>
</html>
